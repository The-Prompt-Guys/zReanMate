<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      --font-sans has always led with Inter, but nothing ever fetched it, so the
      app rendered in whatever the OS offered next: Segoe UI on Windows, Helvetica
      on macOS, Roboto on Android. The layout was being tuned against a font that
      changed per machine. Noto Sans Khmer is loaded for the same reason — Khmer
      fell through to a system face with different metrics again.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
    />

    <title>ReanMate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
